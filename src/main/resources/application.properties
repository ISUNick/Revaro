spring.application.name=revaro

# Real values come from environment variables. The defaults are only for running locally.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/revaro}
spring.datasource.username=${DB_USERNAME:revaro_user}
spring.datasource.password=${DB_PASSWORD:revaro_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

server.error.whitelabel.enabled=false

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.remember-me-key=${REMEMBER_ME_KEY:local-dev-only}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

resend.api-key=${RESEND_API_KEY:}
resend.from-address=noreply@revaromeet.com
