<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title}, ~{})}">
    <title>Sign In | Revaro</title>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">REV<span>aro</span></div>
        <p class="auth-subtitle">Sign in to your account</p>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <form th:action="@{/login}" method="post" class="mt-3" data-submit-once>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="your username" autocomplete="username" required/>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="••••••••" autocomplete="current-password" required/>
            </div>
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe"/>
                    <label class="form-check-label auth-muted" for="rememberMe">Remember me</label>
                </div>
                <a th:href="@{/auth/forgot-password}" class="auth-small-link">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary-revaro w-100 py-2 justify-content-center">Sign In</button>
        </form>

        <hr class="auth-divider"/>
        <p class="auth-switch">Don't have an account? <a th:href="@{/register}">Join Revaro</a></p>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
