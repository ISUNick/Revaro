<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title}, ~{})}">
    <title>Forgot Password | Revaro</title>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">REV<span>aro</span></div>
        <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <form th:action="@{/auth/forgot-password}" method="post" class="mt-3" data-submit-once>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required/>
            </div>
            <button type="submit" class="btn btn-primary-revaro w-100 py-2 justify-content-center">Send Reset Link</button>
        </form>

        <hr class="auth-divider"/>
        <p class="auth-switch"><a th:href="@{/login}">Back to sign in</a></p>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
