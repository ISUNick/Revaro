<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title}, ~{})}">
    <title>Reset Password | Revaro</title>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">REV<span>aro</span></div>
        <p class="auth-subtitle">Choose a new password.</p>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <form th:action="@{/auth/reset-password}" method="post" class="mt-3" data-submit-once>
            <input type="hidden" name="token" th:value="${token}"/>
            <div class="mb-3">
                <label for="password" class="form-label">New Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required/>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                       autocomplete="new-password" required/>
            </div>
            <button type="submit" class="btn btn-primary-revaro w-100 py-2 justify-content-center">Reset Password</button>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
