<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(~{::title}, ~{})}">
    <title th:text="${profileUser.username} + ' | Revaro'">Profile | Revaro</title>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-xl page-medium mt-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="revaro-card profile-header">
        <div th:replace="~{fragments/layout :: avatar(${profileUser}, 'avatar-xl')}"></div>

        <div class="flex-grow-1">
            <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
                <h1 class="profile-name" th:text="${profileUser.username}">Username</h1>
                <span th:if="${profileUser.admin}" class="admin-badge">Admin</span>
            </div>
            <p class="profile-joined">
                Member since <span th:text="${#temporals.format(profileUser.createdAt, 'MMMM yyyy')}">Jan 2026</span>
            </p>
            <div class="d-flex gap-3 flex-wrap align-items-center">
                <div class="rev-points-badge">
                    <i class="bi bi-lightning-charge-fill"></i><span th:text="${revPoints}">0</span> Rev Points
                </div>
                <a th:href="@{/leaderboard}" class="rank-badge">
                    <i class="bi bi-trophy-fill"></i>Ranked <span th:text="'#' + ${userRank}">#1</span>
                </a>
                <div class="profile-stat"><strong th:text="${eventCount}">0</strong> events posted</div>
            </div>
        </div>

        <div sec:authorize="isAuthenticated()" class="d-flex gap-2">
            <a th:if="${#authentication.name == profileUser.username}" th:href="@{/profile/edit}"
               class="btn btn-outline-revaro btn-sm"><i class="bi bi-pencil me-1"></i>Edit Profile</a>
            <form th:if="${#authentication.name != profileUser.username}"
                  th:action="@{/report/user/{u}(u=${profileUser.username})}" method="post">
                <button type="submit" class="btn btn-sm btn-report"
                        data-confirm="Report this user for inappropriate behavior?">
                    <i class="bi bi-flag me-1"></i>Report User
                </button>
            </form>
        </div>
    </div>

    <div class="row g-4">
        <div th:if="${profileUser.hasCar()}" class="col-12 col-md-5">
            <h2 class="section-label">Their Ride</h2>
            <div class="car-showcase-card">
                <div th:if="${!#strings.isEmpty(profileUser.carImage)}" class="car-image-box">
                    <img th:src="${profileUser.carImage}" th:alt="${profileUser.carMake}"/>
                </div>
                <div class="car-name" th:text="${#strings.trim((profileUser.carYear ?: '') + ' ' + profileUser.carMake + ' ' + (profileUser.carModel ?: ''))}">
                    2023 Toyota Supra
                </div>
            </div>
        </div>

        <div th:class="${profileUser.hasCar()} ? 'col-12 col-md-7' : 'col-12'">
            <h2 class="section-label">Events Posted</h2>
            <div th:each="event : ${profileEvents}" class="revaro-card profile-event">
                <div>
                    <a th:href="@{/events/{id}(id=${event.id})}" class="profile-event-title" th:text="${event.title}">Event</a>
                    <div class="profile-event-meta">
                        <span class="event-type-badge badge-small" th:classappend="${event.eventType.badgeClass}"
                              th:text="${event.eventType.displayName}">Type</span>
                        <span th:text="${#temporals.format(event.eventDateTime, 'MMM d, yyyy')}">Jan 1, 2026</span>
                    </div>
                </div>
                <div class="d-flex gap-3 flex-shrink-0 small-counts">
                    <span class="rsvp-count going"><i class="bi bi-check-circle-fill"></i><span th:text="${event.goingCount}">0</span></span>
                    <span class="rsvp-count interested"><i class="bi bi-star-fill"></i><span th:text="${event.interestedCount}">0</span></span>
                </div>
            </div>
            <div th:if="${profileEvents.empty}" class="empty-state empty-state-compact">
                <div class="empty-state-icon"><i class="bi bi-calendar-x"></i></div>
                <p class="mb-0">No events posted yet.</p>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
