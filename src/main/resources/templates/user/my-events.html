<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title}, ~{})}">
    <title>My Events | Revaro</title>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<section class="page-hero">
    <div class="container-xl">
        <h1>My Events</h1>
        <p class="lead mb-0">Events you've created or claimed.</p>
    </div>
</section>

<div class="container-xl page-form mt-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex justify-content-end mb-3">
        <a th:href="@{/events/create}" class="btn btn-primary-revaro gap-1"><i class="bi bi-plus-lg"></i>Post New Event</a>
    </div>

    <div th:each="event : ${events}" class="revaro-card my-event">
        <div>
            <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                <span class="event-type-badge" th:classappend="${event.eventType.badgeClass}" th:text="${event.eventType.displayName}">Type</span>
                <span th:if="${event.status.name() != 'ACTIVE'}" class="status-badge"
                      th:classappend="${'status-' + event.status.name().toLowerCase()}" th:text="${event.status.displayName}">Status</span>
            </div>
            <a th:href="@{/events/{id}(id=${event.id})}" class="my-event-title" th:text="${event.title}">Event Title</a>
            <div class="my-event-meta">
                <span th:text="${#temporals.format(event.eventDateTime, 'EEE, MMM d, yyyy, h:mm a')}">Date</span>
                <span th:if="${event.city != null}" th:text="${event.state != null ? event.city + ', ' + event.state : event.city}">City</span>
            </div>
            <div class="event-rsvp-row mt-2">
                <span class="rsvp-count going"><i class="bi bi-check-circle-fill"></i><span th:text="${event.goingCount}">0</span> Going</span>
                <span class="rsvp-count interested"><i class="bi bi-star-fill"></i><span th:text="${event.interestedCount}">0</span> Interested</span>
            </div>
        </div>
        <a th:href="@{/events/{id}/edit(id=${event.id})}" class="btn btn-outline-revaro btn-sm flex-shrink-0">
            <i class="bi bi-pencil me-1"></i>Edit
        </a>
    </div>

    <div th:if="${events.empty}" class="empty-state">
        <div class="empty-state-icon"><i class="bi bi-calendar-plus"></i></div>
        <div class="empty-state-title">No events yet</div>
        <p class="mb-3">You haven't posted any events. Share one with the community!</p>
        <a th:href="@{/events/create}" class="btn btn-primary-revaro"><i class="bi bi-plus-lg me-1"></i>Post Your First Event</a>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
