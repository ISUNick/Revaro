<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title}, ~{::link})}">
    <title>Edit Profile | Revaro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css"/>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<section class="page-hero">
    <div class="container-xl">
        <h1>Edit Profile</h1>
        <p class="lead mb-0">Update your profile picture and show off your car.</p>
    </div>
</section>

<div class="container-xl page-form mt-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data" data-submit-once>
        <div class="revaro-card form-section">
            <h2 class="section-label">Profile Picture</h2>
            <div class="d-flex align-items-center gap-4 mb-3">
                <div id="avatarPreview">
                    <div th:replace="~{fragments/layout :: avatar(${user}, 'avatar-xl')}"></div>
                </div>
                <div>
                    <label for="profileImageFile" class="form-label">Upload new photo</label>
                    <input type="file" id="profileImageFile" name="profileImageFile" class="form-control"
                           accept="image/jpeg,image/png,image/webp"/>
                    <div class="form-hint">JPG, PNG, or WebP up to 10 MB. It gets cropped to a square.</div>
                </div>
            </div>
            <div id="cropArea" hidden>
                <div class="crop-box"><img id="cropImage" alt="Crop preview"/></div>
                <div class="d-flex gap-2 mt-3 justify-content-center">
                    <button type="button" id="applyCrop" class="btn btn-primary-revaro btn-sm"><i class="bi bi-crop me-1"></i>Apply Crop</button>
                    <button type="button" id="cancelCrop" class="btn btn-outline-revaro btn-sm">Cancel</button>
                </div>
            </div>
        </div>

        <div class="revaro-card form-section">
            <h2 class="section-label">Your Car</h2>
            <p class="form-intro">Show off your ride on your public profile.</p>
            <div class="row g-3">
                <div class="col-4">
                    <label for="carYear" class="form-label">Year</label>
                    <input type="text" id="carYear" name="carYear" class="form-control" th:value="${user.carYear}" placeholder="2023" maxlength="10"/>
                </div>
                <div class="col-4">
                    <label for="carMake" class="form-label">Make</label>
                    <input type="text" id="carMake" name="carMake" class="form-control" th:value="${user.carMake}" placeholder="Toyota" maxlength="60"/>
                </div>
                <div class="col-4">
                    <label for="carModel" class="form-label">Model</label>
                    <input type="text" id="carModel" name="carModel" class="form-control" th:value="${user.carModel}" placeholder="Supra" maxlength="60"/>
                </div>
            </div>
            <div class="mt-3">
                <div th:if="${!#strings.isEmpty(user.carImage)}" class="mb-3">
                    <p class="form-label">Current car photo</p>
                    <div class="car-image-box car-image-current"><img th:src="${user.carImage}" alt="Your car"/></div>
                </div>
                <label for="carImageFile" class="form-label"
                       th:text="${#strings.isEmpty(user.carImage)} ? 'Upload car photo' : 'Replace car photo'">Upload car photo</label>
                <input type="file" id="carImageFile" name="carImageFile" class="form-control" accept="image/jpeg,image/png,image/webp"/>
                <div class="form-hint">Looks best at 16:9. Up to 10 MB.</div>
            </div>
        </div>

        <div class="d-flex gap-3 mb-5">
            <button type="submit" class="btn btn-primary-revaro px-4"><i class="bi bi-check-lg me-1"></i>Save Changes</button>
            <a th:href="@{/profile}" class="btn btn-outline-revaro px-4">Cancel</a>
        </div>
    </form>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"/>
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
<script th:src="@{/js/edit-profile.js}"></script>
</body>
</html>
