<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title}, ~{})}">
    <title>Notifications | Revaro</title>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<section class="page-hero">
    <div class="container-xl"><h1>Notifications</h1></div>
</section>

<div class="container-xl page-small mt-4 mb-5">
    <div th:if="${notifications.empty}" class="revaro-card empty-state">
        <div class="empty-state-icon"><i class="bi bi-bell"></i></div>
        No notifications yet.
    </div>

    <div class="d-flex flex-column gap-2">
        <a th:each="notification : ${notifications}" th:href="${notification.link}"
           class="revaro-card notification" th:classappend="${!notification.read} ? 'unread'">
            <div class="notification-icon" th:switch="${notification.type.name()}">
                <i th:case="'COMMENT_ON_EVENT'" class="bi bi-chat-fill"></i>
                <i th:case="'MENTION'" class="bi bi-at"></i>
                <i th:case="'RSVP_GOING'" class="bi bi-check-circle-fill"></i>
                <i th:case="'RSVP_INTERESTED'" class="bi bi-star-fill"></i>
                <i th:case="'COMMENT_LIKED'" class="bi bi-heart-fill"></i>
                <i th:case="*" class="bi bi-bell-fill"></i>
            </div>
            <div class="notification-content">
                <div class="notification-message" th:text="${notification.message}">Message</div>
                <div class="notification-time" th:text="${#temporals.format(notification.createdAt, 'MMM d, h:mm a')}">Time</div>
            </div>
            <span th:unless="${notification.read}" class="unread-dot"></span>
        </a>
    </div>

    <nav th:if="${notifications.totalPages > 1}" class="pager" aria-label="Pages">
        <a th:href="@{/notifications(page=${notifications.number - 1})}" class="pager-link"
           th:classappend="${notifications.first} ? 'disabled'" aria-label="Previous page"><i class="bi bi-chevron-left"></i></a>
        <span class="pager-status" th:text="'Page ' + ${notifications.number + 1} + ' of ' + ${notifications.totalPages}">Page 1</span>
        <a th:href="@{/notifications(page=${notifications.number + 1})}" class="pager-link"
           th:classappend="${notifications.last} ? 'disabled'" aria-label="Next page"><i class="bi bi-chevron-right"></i></a>
    </nav>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
