<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(~{::title}, ~{})}">
    <title>Error | Revaro</title>
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container-xl mt-5">
    <div class="empty-state">
        <div class="empty-state-icon"><i class="bi bi-exclamation-triangle text-danger"></i></div>
        <div class="empty-state-title" th:switch="${status}">
            <th:block th:case="404">We couldn't find that page</th:block>
            <th:block th:case="403">You don't have access to that</th:block>
            <th:block th:case="*">Something went wrong</th:block>
        </div>
        <p class="mb-4">Head back to the homepage and try again.</p>
        <a th:href="@{/}" class="btn btn-primary-revaro"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
