# Runs the app and a Postgres database locally: docker compose up
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: revaro
      POSTGRES_USER: revaro_user
      POSTGRES_PASSWORD: revaro_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revaro_user -d revaro"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/revaro
      DB_USERNAME: revaro_user
      DB_PASSWORD: revaro_pass
    ports:
      - "8080:8080"

volumes:
  postgres_data:
